version: "3"
tasks:
  default:
    cmds:
      - task --list
    silent: true

  dev:
    desc: Hint for starting backend + frontend (run them in separate terminals).
    cmds:
      - echo "task dev:infra      # Postgres via docker compose"
      - echo "task dev:backend    # FastAPI on :8000 with reload"
      - echo "task dev:frontend   # Vite on :5173"

  dev:backend:
    desc: Start FastAPI with hot-reload on :8000.
    dir: backend
    cmds:
      - uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 --reload

  dev:frontend:
    desc: Start Vite dev server on :5173 (proxies /api and /mcp → :8000).
    dir: frontend
    cmds:
      - npm run dev

  dev:infra:
    desc: Start local Postgres via docker compose.
    cmds:
      - docker compose -f docker-compose.dev.yml --profile db up -d

  dev:infra:down:
    desc: Stop local infra.
    cmds:
      - docker compose -f docker-compose.dev.yml --profile db down

  install:
    desc: Sync backend deps + install frontend deps.
    cmds:
      - task: install:backend
      - task: install:frontend

  install:backend:
    desc: uv sync the backend.
    dir: backend
    cmds:
      - uv sync

  install:frontend:
    desc: npm install the frontend.
    dir: frontend
    cmds:
      - npm install

  migrate:
    desc: Apply pending Alembic migrations.
    dir: backend
    cmds:
      - uv run alembic upgrade head

  migrate:new:
    desc: 'Generate a new autogenerated migration. Usage: task migrate:new -- "describe change"'
    dir: backend
    cmds:
      - uv run alembic revision --autogenerate -m "{{.CLI_ARGS}}"

  db-reset:
    desc: Drop and recreate the local Postgres volume (destructive — local only).
    cmds:
      - docker compose -f docker-compose.dev.yml --profile db down -v
      - docker compose -f docker-compose.dev.yml --profile db up -d

  test:
    desc: Run all tests.
    cmds:
      - task: test:backend
      - task: test:frontend

  test:backend:
    desc: Run backend pytest.
    dir: backend
    cmds:
      - uv run pytest

  test:frontend:
    desc: Run frontend tests (Vitest — ships with the RequireAuth reauth-loop regression test).
    dir: frontend
    cmds:
      - npm test

  fmt:
    desc: Format all code.
    cmds:
      - task: fmt:backend

  fmt:backend:
    desc: ruff format.
    dir: backend
    cmds:
      - uv run ruff format .

  lint:
    desc: Lint all code.
    cmds:
      - task: lint:backend
      - task: lint:frontend

  lint:backend:
    desc: ruff check + format check.
    dir: backend
    cmds:
      - uv run ruff check .
      - uv run ruff format --check .

  lint:frontend:
    desc: eslint.
    dir: frontend
    cmds:
      - npm run lint

  build:
    desc: Build the frontend for production.
    dir: frontend
    cmds:
      - npm ci
      - npm run build
